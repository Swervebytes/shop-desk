services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopdesk
      POSTGRES_PASSWORD: shopdesk
      POSTGRES_DB: shopdesk
    ports:
      - "5432:5432"
    volumes:
      - shopdesk-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopdesk -d shopdesk"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=shopdesk;Username=shopdesk;Password=shopdesk
      Jwt__Key: local-compose-shop-desk-jwt-key!!
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  shopdesk-pg:
